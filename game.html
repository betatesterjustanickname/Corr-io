<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>corr.io</title>
<style>body{margin:0;background:#1a1a1a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=rs;
const WORLD=2000,CAP=10;
let p,mobs,allies,pet,kills,t=0,spawnT=0,mx=0,my=0,mouseB=0,R=55;
const ptrs=new Map(),keys={};
function reset(){
  p={x:1000,y:1000,hp:100,max:100};
  mobs=[];allies=[];kills=0;
  pet=[{k:'basic'},{k:'basic'},{k:'our'},{k:'stal',life:6,broke:0},{k:'basic'}];
}
reset();
function btns(){return{a:{x:c.width-80,y:c.height-90,r:52},d:{x:c.width-195,y:c.height-65,r:42}}}
function hit(b,e){return Math.hypot(e.clientX-b.x,e.clientY-b.y)<=b.r+10}
oncontextmenu=e=>e.preventDefault();
onkeydown=e=>{keys[e.code]=1};onkeyup=e=>{keys[e.code]=0};
onpointerdown=e=>{
  if(e.pointerType==='mouse'){mx=e.clientX;my=e.clientY;mouseB=e.buttons;return}
  const B=btns();let ty='move';
  if(hit(B.a,e))ty='atk';else if(hit(B.d,e))ty='def';
  ptrs.set(e.pointerId,ty);
  if(ty==='move'){mx=e.clientX;my=e.clientY}
};
onpointermove=e=>{
  if(e.pointerType==='mouse'){mx=e.clientX;my=e.clientY;mouseB=e.buttons;return}
  if(ptrs.get(e.pointerId)==='move'){mx=e.clientX;my=e.clientY}
};
onpointerup=onpointercancel=e=>{
  if(e.pointerType==='mouse'){mouseB=e.buttons;return}
  ptrs.delete(e.pointerId);
};
function nearest(o,list){let b=null,bd=1e9;for(const m of list){const d=Math.hypot(m.x-o.x,m.y-o.y);if(d<bd){bd=d;b=m}}return b}
function loop(now){
  const dt=Math.min(0.05,(now-(loop.l||now))/1000);loop.l=now;t+=dt;
  const vals=[...ptrs.values()];
  const atk=!!(mouseB&1)||!!keys.Space||vals.includes('atk');
  const def=!atk&&(!!(mouseB&2)||!!keys.ShiftLeft||!!keys.ShiftRight||vals.includes('def'));
  const moving=vals.includes('move')||(mx||my)&&ptrs.size===0&&mouseB>=0&&matchMedia('(pointer:fine)').matches;
  const dx=mx-c.width/2,dy=my-c.height/2,d=Math.hypot(dx,dy);
  if(moving&&d>12){p.x+=dx/d*220*dt;p.y+=dy/d*220*dt}
  p.x=Math.max(0,Math.min(WORLD,p.x));p.y=Math.max(0,Math.min(WORLD,p.y));
  p.hp=Math.min(p.max,p.hp+2*dt);
  spawnT-=dt;
  if(spawnT<=0&&mobs.length<25){
    spawnT=1.2;const a=Math.random()*6.28,r=500+Math.random()*300;
    mobs.push({x:Math.max(0,Math.min(WORLD,p.x+Math.cos(a)*r)),y:Math.max(0,Math.min(WORLD,p.y+Math.sin(a)*r)),hp:30,r:16,inv:0});
  }
  for(const m of mobs){
    m.inv-=dt;
    if(Math.hypot(p.x-m.x,p.y-m.y)<450){const a=Math.atan2(p.y-m.y,p.x-m.x);m.x+=Math.cos(a)*80*dt;m.y+=Math.sin(a)*80*dt}
    if(Math.hypot(p.x-m.x,p.y-m.y)<m.r+14)p.hp-=10*dt;
  }
  const RT=atk?95:def?28:55;
  R+=(RT-R)*Math.min(1,dt*10);
  pet.forEach((q,i)=>{
    if(q.k==='stal'){
      if(q.broke>0){q.broke-=dt;if(q.broke<=0)q.life=6}
      else{q.life-=dt;if(q.life<=0)q.broke=12}
    }
    const a=t*2+i*Math.PI*2/pet.length;
    q.x=p.x+Math.cos(a)*R;q.y=p.y+Math.sin(a)*R;
    if(q.k==='stal'&&q.broke>0)return;
    const dmg=q.k==='stal'?40:q.k==='our'?6:8;
    for(const m of mobs){
      if(m.inv>0)continue;
      if(Math.hypot(q.x-m.x,q.y-m.y)<m.r+10){
        m.hp-=dmg;m.inv=0.25;
        if(q.k==='our'&&allies.length<CAP){
          const a2=Math.random()*6.28,r2=60+Math.random()*50;
          allies.push({x:p.x+Math.cos(a2)*r2,y:p.y+Math.sin(a2)*r2,hp:30,r:9,cd:0});
        }
      }
    }
  });
  for(const s of allies){
    s.cd-=dt;
    const m=nearest(s,mobs);
    const tg=m&&Math.hypot(m.x-s.x,m.y-s.y)<600?m:p;
    const a=Math.atan2(tg.y-s.y,tg.x-s.x);
    if(Math.hypot(tg.x-s.x,tg.y-s.y)>25){s.x+=Math.cos(a)*200*dt;s.y+=Math.sin(a)*200*dt}
    for(const mm of mobs){
      if(Math.hypot(mm.x-s.x,mm.y-s.y)<mm.r+s.r){
        s.hp-=15*dt;
        if(s.cd<=0){mm.hp-=15;s.cd=0.5}
      }
    }
  }
  allies=allies.filter(s=>s.hp>0);
  const before=mobs.length;
  mobs=mobs.filter(m=>m.hp>0);
  kills+=before-mobs.length;
  if(p.hp<=0)reset();
  draw(atk,def);requestAnimationFrame(loop);
}
function draw(atk,def){
  const cx=p.x-c.width/2,cy=p.y-c.height/2;
  x.fillStyle='#3d6b3a';x.fillRect(0,0,c.width,c.height);
  x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=1;
  for(let g=0;g<=WORLD;g+=100){
    x.beginPath();x.moveTo(g-cx,-cy);x.lineTo(g-cx,WORLD-cy);x.stroke();
    x.beginPath();x.moveTo(-cx,g-cy);x.lineTo(WORLD-cx,g-cy);x.stroke();
  }
  x.strokeStyle='#000';x.lineWidth=4;x.strokeRect(-cx,-cy,WORLD,WORLD);
  for(const m of mobs){
    x.fillStyle='#b22';x.beginPath();x.arc(m.x-cx,m.y-cy,m.r,0,6.28);x.fill();
    x.fillStyle='#000';
    for(const o of [[-6,-4],[6,-4],[0,6]]){x.beginPath();x.arc(m.x-cx+o[0],m.y-cy+o[1],3,0,6.28);x.fill()}
    x.fillStyle='#000';x.fillRect(m.x-cx-16,m.y-cy-m.r-9,32,4);
    x.fillStyle='#e33';x.fillRect(m.x-cx-16,m.y-cy-m.r-9,32*Math.max(0,m.hp/30),4);
  }
  for(const s of allies){
    x.fillStyle='#600';x.strokeStyle='#fc0';x.lineWidth=2;
    x.beginPath();x.arc(s.x-cx,s.y-cy,s.r,0,6.28);x.fill();x.stroke();
  }
  x.fillStyle='#ffe066';x.strokeStyle='#b8962e';x.lineWidth=3;
  x.beginPath();x.arc(p.x-cx,p.y-cy,16,0,6.28);x.fill();x.stroke();
  x.fillStyle='#000';
  x.beginPath();x.arc(p.x-cx-5,p.y-cy-3,2.5,0,6.28);x.fill();
  x.beginPath();x.arc(p.x-cx+5,p.y-cy-3,2.5,0,6.28);x.fill();
  for(const q of pet){
    const px=q.x-cx,py=q.y-cy;
    if(q.k==='stal'){
      if(q.broke>0){x.globalAlpha=.25}
      else if(q.life<2&&Math.floor(t*10)%2){x.globalAlpha=.4}
      x.fillStyle='#400';x.strokeStyle='#fc0';x.lineWidth=3;
      x.beginPath();x.arc(px,py,11,0,6.28);x.fill();x.stroke();
      x.globalAlpha=1;
    }else if(q.k==='our'){
      x.fillStyle='#c00';x.strokeStyle='#fc0';x.lineWidth=3;
      x.beginPath();x.arc(px,py,11,0,6.28);x.fill();x.stroke();
      x.fillStyle='#fc0';x.font='bold 8px sans-serif';x.textAlign='center';x.fillText('OUR',px,py+3);
    }else{
      x.fillStyle='#fff';x.strokeStyle='#bbb';x.lineWidth=3;
      x.beginPath();x.arc(px,py,9,0,6.28);x.fill();x.stroke();
    }
  }
  // HUD
  x.fillStyle='#000';x.fillRect(20,20,204,20);
  x.fillStyle='#6f6';x.fillRect(22,22,200*Math.max(0,p.hp/p.max),16);
  x.fillStyle='#fff';x.font='16px sans-serif';x.textAlign='left';
  x.fillText('Kill: '+kills+'   Asker: '+allies.length+'/'+CAP,20,65);
  const s=pet.find(q=>q.k==='stal');
  x.fillStyle='#fc0';
  x.fillText(s.broke>0?'STALINIUM(fake): kirildi '+Math.ceil(s.broke)+'s':'STALINIUM(fake): '+s.life.toFixed(1)+'s',20,90);
  // butonlar
  const B=btns();
  for(const [k,b,on,txt] of [['a',B.a,atk,'SALDIR'],['d',B.d,def,'SAVUN']]){
    x.globalAlpha=on?.8:.45;
    x.fillStyle=k==='a'?'#c00':'#246';x.strokeStyle='#fc0';x.lineWidth=3;
    x.beginPath();x.arc(b.x,b.y,b.r,0,6.28);x.fill();x.stroke();
    x.globalAlpha=1;x.fillStyle='#fff';x.font='bold 14px sans-serif';x.textAlign='center';
    x.fillText(txt,b.x,b.y+5);
  }
  x.fillStyle='#ddd';x.font='12px sans-serif';x.textAlign='left';
  x.fillText('Parmak: hareket | PC: sol tik/Space saldir, sag tik/Shift savun',20,c.height-20);
}
requestAnimationFrame(loop);
</script></body></html>
